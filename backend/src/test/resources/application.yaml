spring:
  datasource:
    url: jdbc:h2:mem:devnest-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
devnest:
  security:
    jwt-secret: test-secret-for-automated-tests
  cors:
    allowed-origins:
      - http://localhost:5173
  community:
    limits:
      posts-per-24-hours: 5
      comments-per-minute: 20
      reactions-per-minute: 60
      duplicate-content-window-minutes: 10
